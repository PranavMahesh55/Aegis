name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install API dependencies
        run: python -m pip install -e 'apps/api[dev]'

      - name: Install web dependencies
        run: npm --prefix apps/web ci

      - name: Lint API
        run: ruff check apps/api

      - name: Test API
        run: python -m pytest apps/api/tests -q

      - name: Test web
        run: npm --prefix apps/web test -- --run

      - name: Build web
        run: npm --prefix apps/web run build

      - name: Validate Python package
        run: python -m compileall -q apps/api/aegis
