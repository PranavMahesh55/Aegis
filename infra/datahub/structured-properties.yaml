- id: io.aegis.approvalStatus
  qualified_name: io.aegis.approvalStatus
  type: string
  cardinality: SINGLE
  display_name: Aegis approval status
  entity_types:
    - dataset
  description: Approval state used by Aegis deterministic safety controls.
  allowed_values:
    - value: approved
      description: Approved for production agent context.
    - value: not_approved
      description: Not approved for production agent context.
    - value: revoked
      description: Previously approved and explicitly revoked.

